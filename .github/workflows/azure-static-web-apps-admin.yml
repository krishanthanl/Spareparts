name: Deploy admin website

on:
  push:
    branches: [main]
    paths: ['src/admin-web/**', 'package.json', 'package-lock.json', '.github/workflows/azure-static-web-apps-admin.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      - name: Build admin website
        run: npm run build --workspace=@spareparts/admin-web
        env:
          VITE_API_BASE_URL: https://auto-aaf5abc0cneeffhe.westus3-01.azurewebsites.net

      - name: Upload to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          action: upload
          app_location: src/admin-web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
