name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Docker is available on GitHub runners, so Testcontainers starts a throwaway PostgreSQL 17.
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Spareparts.slnx --locked-mode
      - name: Build
        run: dotnet build Spareparts.slnx --no-restore -c Release
      - name: Unit and API tests
        run: dotnet test tests/Backend.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"
      - name: PostgreSQL integration tests
        run: dotnet test tests/Backend.IntegrationTests --no-build -c Release --logger "trx;LogFileName=postgres.trx"
      - name: Report failing tests as annotations
        if: failure()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in glob.glob('tests/**/TestResults/*.trx', recursive=True):
              for r in ET.parse(path).getroot().iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') != 'Failed':
                      continue
                  msg = r.find('.//t:Message', ns)
                  stack = r.find('.//t:StackTrace', ns)
                  text = ((msg.text or '') + ' | ' + (stack.text or '')[:600]) if msg is not None else 'failed'
                  text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:1800]
                  print(f"::error title={r.get('testName')[:150]}::{text}")
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontends (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
